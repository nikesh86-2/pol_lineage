# =============================================================================
# hbvpol — Python analysis stack
# -----------------------------------------------------------------------------
# This mirrors the environment that is already active (`pol`):
#   module load miniforge
#   mamba env create -f environment.yml      # or update an existing env:
#   mamba env update -n pol -f environment.yml
#   conda activate pol
#   pip install -e .
#
# Command-line bioinformatics tools (mafft, iqtree, hyphy, ...) live in
# environment-tools.yml, and tools distributed outside conda (RDP5, 3SEQ,
# GROMACS) are covered in docs/external_tools.md.
# =============================================================================
name: pol
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip

  # --- core analysis (versions match the installed `pol` env) ---------------
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.14
  - biopython>=1.84
  - pyyaml>=6.0
  - scikit-bio>=0.6
  - ete3>=3.1.3
  - matplotlib>=3.9
  - seaborn>=0.13
  - networkx>=3.3
  - pyarrow>=17.0            # parquet output for the residue atlas

  # --- workflow --------------------------------------------------------------
  - snakemake-minimal>=8.0

  # --- optional structure help (pure-python) ---------------------------------
  # AlphaFold/ColabFold/ESMFold are orchestrated as external tools; see
  # docs/external_tools.md.  No build-time-heavy embedding packages here.
  - mdanalysis>=2.8
  - py3dmol>=2.0

  - pip:
      - pytest>=8.0
      - pytest-cov>=5.0
      # Embeddings: use the maintained `fair-esm` rather than `bio-embeddings`,
      # which pins gensim<4 and fails to build on modern NumPy/Python.
      - fair-esm>=2.0
