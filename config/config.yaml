# =============================================================================
# hbvpol master configuration
# -----------------------------------------------------------------------------
# Every stage of the pipeline is driven from this file.  Paths are relative to
# the project root unless absolute.  Command-line overrides use dot notation:
#     hbvpol run selection.entropy_window=50
# =============================================================================

project:
  name: hbv-pol-lineage
  output_root: output            # all generated artefacts land below here
  threads: 8
  seed: 20240911
  # Fail fast if these external tools are absent, so a publication run never
  # silently falls back to the pure-Python stand-ins.  Empty = allow fallbacks.
  #   required_tools: [mafft, iqtree2, hyphy, trimal]
  required_tools: []

# -----------------------------------------------------------------------------
# Stage 1a — Human-HBV dataset
# -----------------------------------------------------------------------------
datasets:
  hbv:
    # Prefer NCBI GenBank as the sequence-of-record; use HBVdb for an
    # independently annotated cross-check; HBV-GLUE for its maintained
    # alignments, genotype assignments and SAM/BAM offline analysis.
    sources:
      - genbank
      - hbvdb
      - glue
    genbank:
      # Full-text query executed against NCBI E-utilities / efetch.
      query: >-
        "Hepatitis B virus"[Organism] AND
        (complete genome[Title] OR complete sequence[Title])
      max_records: 60000
      email: null                # REQUIRED for NCBI: set to a real address
      api_key: null              # optional, raises rate limit
    hbvdb:
      base_url: https://hbvdb.ibcp.fr
      # HBVdb is independently curated but check its release date before
      # treating it as the sequence-of-record (see docs/datasets.md).
      max_release_age_days: 730
    glue:
      accession: HBV
      # HBV-GLUE ships maintained alignments + a genotype reference set.
      use_maintained_alignment: true
      use_genotype_reference: true
    metadata:
      require: [genotype, country, year]
      desirable: [subgenotype, isolation_source, treatment_status, patient_id]
      allow_missing: true
    longitudinal:
      # Link reads from the same patient_id sampled on different dates.
      enabled: true
      min_timepoints: 2

# -----------------------------------------------------------------------------
# Stage 1b — Deep hepadnavirus / nackednavirus Pol alignment
# -----------------------------------------------------------------------------
deephep:
  taxonomic_groups:
    - primate
    - rodent
    - bat
    - avian
    - reptile
    - amphibian
    - fish
  include_nackednavirus: true          # fish nackednaviruses (defensible orthologs)
  include_rt_outgroups: true           # carefully chosen RT-family outgroups
  outgroups:
    - "Caulimoviridae"                 # plant pararetroviruses (RT homologues)
    - "Ty3/Gypsy LTR retrotransposons"
  # Retrieval is driven by per-group Entrez queries (defaults in
  # hbvpol.datasets.deephep.DEFAULT_GROUP_QUERIES).  [Host] qualifiers are not
  # indexed in the NCBI protein database, so the defaults target virus taxa.
  # Override a group with a string or a list of alternative terms:
  # group_queries:
  #   bat: "(Bat hepatitis B virus[Organism] OR Bat hepadnavirus[Organism])"
  #   rodent: ["Woodchuck hepatitis virus[Organism]", "Ground squirrel hepatitis virus[Organism]"]
  # Per-group Pol-restriction suffix; an empty string disables it.
  # group_query_suffixes:
  #   nackednavirus: "AND (polymerase[Title] OR P[Title] OR ORF2[Title])"
  # Reptile and amphibian hepadnaviruses have no NCBI protein records, so those
  # groups legitimately return zero (see docs/datasets.md).
  max_per_group: 500
  fetch_batch_size: 200
  min_pol_length: 500
  max_pol_length: 1200
  # Alignment: MAFFT L-INS-i for < 200 seqs, then HMMER/Pfam-guided profile
  aligner: mafft-linsi
  profile_hmm: null                    # e.g. Pfam PF00078 (RT) to anchor
  trim: [gblocks]                      # gblocks | trimAl | none

# -----------------------------------------------------------------------------
# Stage 2 — Quality control and recombination
# -----------------------------------------------------------------------------
reference:
  # NCBI's reference sequence NC_003977.2 is genotype D (ayw): 3182 bp, 832 aa
  # Pol.  The constants below are *fallbacks*; the `reference` stage derives the
  # true values from the annotation and load_config overrides them.
  accession: NC_003977
  length: 3182
  # Derive coordinates from the annotated reference instead of trusting the
  # constants below.  The `reference` stage writes
  # <output_root>/reference/reference_features.json, which load_config merges
  # into this subtree (config file < derived features < explicit overrides).
  auto_derive: true
  derived_file: null                   # default reference/reference_features.json
  genbank_file: null                   # local annotated GenBank; else fetched
  # Circularisation origin, in standard HBV numbering.  The unique EcoRI site
  # defines nt 1, so recutting at the canonical origin is the identity for
  # records already in standard numbering.  qc.detect_origin uses the derived
  # reference to recover the origin for arbitrarily rotated records.
  origin_nt: 1
  pol_start_nt: 2309                   # fallback; derived from the annotation
  pol_end_nt: 1625                     # P ORF end, wraps the origin
  # S/C spans are derived from the reference; uncomment to pin them explicitly.
  # s_start_nt: 2850
  # s_end_nt: 837
  # c_start_nt: 1816
  # c_end_nt: 2454
  # Pol domain boundaries (amino acids).  null -> the documented fallbacks;
  # supply genotype-specific spans to make them exact.  Clamped to
  # reference.pol_length_aa (derived) when present.
  # domain_spans:
  #   - {domain: TP,     start: 1,   end: 183}
  #   - {domain: spacer, start: 184, end: 336}
  #   - {domain: RT,     start: 337, end: 681}
  #   - {domain: RNaseH, start: 682, end: 832}
  # Per-genotype calibrated boundaries (TSV: genotype, domain, start, end).  A
  # row for the requested genotype wins over the list above; a 'default' row is
  # used when the genotype is absent.  Calibrate with
  # scripts/locate_pol_domains.py.  Set to null to ignore the table.
  domain_spans_file: resources/pol_domain_spans.tsv

qc:
  min_length: 2800
  # Concatemers / multi-genome constructs survive a min-length filter.
  max_length: 3250
  max_ambiguous_frac: 0.02             # N / IUPAC gaps
  require_complete_orf: [pol, s, c]    # reject frameshift/stop-riddled records
  exclude_stop_in_pol: true
  max_internal_stops: 0
  circularise: true                    # all genomes recut at reference origin
  # Detect the origin per record by matching the reference (needs
  # reference.sequence, supplied by the reference stage).  Conservative: it
  # falls back to reference.origin_nt when the seed cannot be located.
  detect_origin: true
  dereplicate: true
  dereplicate_identity: 0.9999

phylogeny:
  # IQ-TREE model finder and ultrafast bootstrap.
  model_finder: MFP
  bootstrap: 1000
  root: null                           # outgroup name or "midpoint"
  ancestral_method: auto               # auto | iqtree | parsimony
  # Taxon caps.  Full-genome HBV datasets hold thousands of near-identical
  # genomes; inferring trees on all of them is intractable, so trees use a
  # deterministic subsample of this many taxa.
  max_taxa: 1000
  # Hard guard for the pure-Python Neighbor-Joining fallback: p-distances are
  # O(N^2) and NJ is O(N^3), which never finishes on a large taxon set, so it
  # refuses rather than hangs.  Keep this low: even 1000 taxa is intractable in
  # pure Python, and IQ-TREE should handle anything larger.
  max_nj_taxa: 200

recombination:
  # RDP5 is the original Windows binary; OpenRDP is its Python
  # re-implementation and is used in its place when installed.
  tools: [openrdp, gard, threeseq, bootscan]
  # A breakpoint is accepted when >= this fraction of independent tools agree.
  consensus_frac: 0.5
  min_block_len: 300
  min_seqs_for_scan: 4
  # Breakpoint detection is quadratic in sequence count; run it on this many
  # sequences (deterministic subset) rather than the whole alignment.
  max_seqs_for_scan: 200
  gard:
    rate_variation: gamma
    n_categories: 4
  rdp5:
    executable: rdp5
    discontiguous: false
    # Detect individual domains of Pol separately, then reconcile.
    domain_wise: true
  openrdp:
    # Python re-implementation of RDP4 (PoonLab).  It pins numpy<2 and
    # h5py<3.11, so install it in its own environment and point this at
    # <envs>/openrdp/bin/openrdp; see docs/external_tools.md.
    executable: openrdp
    # RDP-family methods to run.  Some (maxchi/siscan/chimaera) abort on some
    # inputs, so only the stable subset is enabled by default.
    methods: [rdp, threeseq]
    seed: 3
    fail: 100
    cfg: null                      # optional OpenRDP .ini
  threeseq:
    executable: 3seq               # bioconda; options are attached (-t0.05)
    threshold: 0.05
    id: hbvpol                     # prefixes <id>.3s.rec.csv
  bootscan:
    window: 500
    step: 50
    replicates: 100
    threshold: 0.70
    # Specificity guards for the offline scan.  On thousands of near-identical
    # genomes the nearest neighbour flips between equally-similar references,
    # so require the swapped partner to beat the primary by this margin, and
    # drop short / weakly supported regions.
    min_score_margin: 0.02
    min_region_len: 300
    min_support: 0.0
  # After partitioning, retain only blocks carrying a majority of the
  # recombination signal-free evidence.
  min_retained_frac: 0.6
  # Explicitly model the B/C hotspot described in the literature.
  hotspots: ["BC"]                     # flag + prioritise B/C recombinants

# -----------------------------------------------------------------------------
# Stage 3 — Multi-level evolutionary constraints
# -----------------------------------------------------------------------------
selection:
  domains: [TP, spacer, RT, RNaseH]    # Pol is partitioned into these units
  dual_frame: true                     # classify each change in Pol AND surface
  # Run covariation/epistasis/DCA on the translated Pol protein alignment, so
  # positions are Pol residues that match entropy and the atlas.  DCA is
  # conventionally a protein method; false uses nucleotide alignment columns.
  protein_covariation: true
  window: 21                           # sliding-window width (codons)
  methods: [fel, meme, fubar, busted]
  # Per-site selection runs on the recombination-free block supermatrix.
  per_block: true
  covariation:
    methods: [mutual_information, dca]
    # pydca/plmDCA is unmaintained.  The shipped adapter shells out to plmc
    # (mamba install -c bioconda plmc); dca_impl may be any importable module
    # exposing dca_scores(alignment[, config]).  Set to '' to skip DCA.
    dca_impl: hbvpol.selection.plmc_backend
    plmc_executable: plmc
    plmc_fast: false            # plmc --fast (stochastic gradient) for large sets
    min_seqs: 500
    # Fail instead of silently using the APC-corrected MI proxy when a real DCA
    # backend is required (set true for a publication run).
    require_backend: false
    # Pairwise metrics are O(L^2). Scan only variable columns, and cap them.
    min_entropy: 0.05          # bits; skip near-invariant columns
    max_positions: 600         # performance guard (keep the most entropic)
    top_n: 2000                # cap reported pairs per method
  epistasis:
    method: pairwise_epistasis
    min_support: 0.05
    min_entropy: 0.05
    max_positions: 600
    top_n: 2000
  genotype_specificity:
    # Fraction of between-genotype variance to treat a site as informative.
    min_fst: 0.25
  drug_resistance:
    catalogue: resources/hbv_pol_resistance.tsv
  structural:
    # Solvent accessibility / pLDDT joined from the structure stage.
    join_on: [lineage, position]

# -----------------------------------------------------------------------------
# Stage 4 — Structural ensemble
# -----------------------------------------------------------------------------
structure:
  strategies: [colabfold, alphafold3, esmfold]   # multiple predictors
  seeds: 5
  states:
    - apo
    - eps_bound
    - priming
    - rna_dna_hybrid
    - elongation
  lineages: [A, B, C, D, E, F, G, H]             # genotype-specific models
  mutants_file: resources/pol_mutants.tsv        # resistant + compensatory
  metrics:
    - plddt
    - pae
    - domain_orientation
    - catalytic_geometry
    - nucleic_acid_compatibility
    - conserved_packing
  # Regions below this pLDDT are retained and reclassified as candidate hinges.
  hinge_plddt: 70
  md:
    engine: gromacs
    forcefield: amber14sb
    water: tip3p
    ns_per_model: 100
    n_models: 20                                 # 10-20 prioritised models
    pocket_persistence_frac: 0.5                 # transient-cavity criterion

# -----------------------------------------------------------------------------
# Stage 5 — Epsilon RNA / Pol coevolution
# -----------------------------------------------------------------------------
epsilon:
  # epsilon is ~60-70 nt; secondary structure from the literature is a
  # stem-bulge-stem with the priming bulge and an alternative cryptic fold.
  length_nt: [55, 70]
  fold_models: [literature, rnafold, alphafold3_rna]
  # Per-genotype coordinates.  Resolution order: the table row for the record's
  # genotype, then a `default` row, then `genome_span` below.  The shipped table
  # carries a documented default; curate genotype rows to make it exact.
  spans_file: resources/epsilon_spans.tsv
  genome_span: [1846, 1905]            # fallback, reference numbering (EcoRI origin)
  # Covariation between TP residues and epsilon base pairs.
  coevolve:
    method: mutual_information
    residue_window: TP
    rna_features: [base_pair, bulge, loop]
  compatibility:
    # Predict Pol-epsilon affinity for every (genotype Pol, genotype epsilon) pair.
    matrix: cross_genotype
    predictor: contact_map_energy

# -----------------------------------------------------------------------------
# Stage 6 — Experimental fitness anchor
# -----------------------------------------------------------------------------
fitness:
  dms:
    # 2024 single-nucleotide-resolution deep mutational scanning fitness map
    # of HBV polymerase (cis-preferential reverse transcription / ribosome
    # pausing).  Provide as a tidy TSV: wt_nt, position, mut_nt, fitness.
    map: resources/hbv_pol_dms_2024.tsv
    wt_reference: NC_003977
    join_on_nt: true
  criteria:
    # A residue is a strong mechanistic candidate when it satisfies all of:
    conserved_deep_hepadna: true
    intolerant_dms: true
    interface_or_hinge: true
    supported_covariation: true
    not_explained_by_surface_frame: true
    # Named motifs excluded from the candidate list.  Tokens resolve against
    # hbvpol.domain.CANONICAL_MOTIFS (a name) or a letter range ("A-F"); add
    # e.g. the NJG primer-grip motif there first, then list it here.
    distinct_from_canonical_motifs: [YMDD, "A-F"]

# -----------------------------------------------------------------------------
# Stage 7 — Outputs / residue atlas
# -----------------------------------------------------------------------------
atlas:
  interactive: true
  formats: [tsv, parquet, html]
  # The unified per-position table joins every score computed above.
  key: [lineage, pol_position]
  # Restrict the atlas to annotated Pol residues (drop positions outside TP /
  # spacer / RT / RNaseH).  Set true to retain genome-wide rows.
  include_unannotated: false
  report:
    # The report is assembled from dependency-free string templates in
    # hbvpol.atlas.report; no external template file is required.
    include: [phylogeny, domains, selection, structure, epsilon, fitness]
  ranked_targets:
    # how to build the ranked biochemical-validation shortlist
    weights:
      conservation: 0.3
      dms_intolerance: 0.3
      structural_interface: 0.2
      covariation: 0.2
    top_n: 50
