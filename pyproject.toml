[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbvpol"
version = "0.1.0"
description = "Recombination-aware phylogenetics, dual-frame selection and structural evolution of hepatitis B virus polymerase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HBV Pol Lineage Project" }]
keywords = ["hepadnavirus", "HBV", "phylogenetics", "recombination", "evolution", "dual-frame codon model", "structural biology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "biopython>=1.81",
    "pyyaml>=6.0",
    "snakemake>=7.32",
    "ete3>=3.1.3",
    "scikit-bio>=0.5.9",      # alignment + entropy/distance primitives
    "regex>=2023.6",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
structure = [
    "bio-embeddings>=0.2",
    "py3Dmol>=2.0",
    "mdanalysis>=2.0",
    "rdkit>=2023.3",          # pocket / small-molecule screening helpers
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
hbvpol = "hbvpol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"